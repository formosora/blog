services:
  blog:
    build: .
    container_name: blog
    ports:
      # bound to localhost only — reachable through Caddy, never directly public
      - "127.0.0.1:8080:8080"
    environment:
      # no insecure default: compose refuses to start unless ADMIN_PASSWORD is set
      # (put it in a gitignored .env file:  ADMIN_PASSWORD=your-strong-secret)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env or the environment}
    volumes:
      - blog-data:/app/data
    restart: unless-stopped

volumes:
  blog-data:
